[project]
name = "greyridge-x402-tools"
version = "0.8.4"
description = "Live decision-tagged DeFi & trading market data for AI agents, keyless x402 pay-per-call on Base: per-pool yield ENTRY VERDICTs (SUSTAINABLE/DECAYING/OUTLIER/AVOID + risk score), 6-venue OI-weighted perp funding-rate arbitrage, and token spot prices with a confidence score — free preview on every call. Also x402 safe-fetch (free preflight + dual-RPC on-chain receipt proof) and an MCP server security scanner (tool-poisoning / prompt-injection, OWASP LLM01/LLM08)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["defi", "defi-data", "defi-yields", "apy", "yield-farming", "funding-rate", "funding-arbitrage", "perp-funding", "open-interest", "crypto-prices", "market-data", "trading-agent", "crypto", "ai-agents", "x402", "base", "pay-per-call", "mcp", "mcp-server", "security", "scanner", "tool-poisoning", "prompt-injection", "agent-safety", "safe-fetch", "payment-verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28"]
[project.optional-dependencies]
pay = ["x402>=0.2", "eth-account"]
langchain = ["langchain-core"]
[project.scripts]
greyridge-gate = "greyridge_x402.cli:gate_main"
greyridge-report = "greyridge_x402.cli:report_main"
greyridge-data = "greyridge_x402.cli:data_main"
greyridge-x402-verify = "greyridge_x402.mcp_verify:main"
[project.urls]
Homepage = "https://github.com/rezearcher/greyridge-x402-tools"
Documentation = "https://rezearcher.github.io/greyridge-x402-tools/"
API = "https://api.greyridgesignals.ai/.well-known/x402"
Scorecards = "https://rezearcher.github.io/greyridge-x402-tools/mcp-server-scorecards.html"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["greyridge_x402"]
